<!DOCTYPE html>
<html>
<head>
  <title>QR Machine Dashboard</title>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    h1 { margin-top: 30px; }

    .container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
      flex-wrap: wrap;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      width: 200px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .card:hover {
      transform: scale(1.05);
      background: #334155;
    }

    .status {
      margin-top: 10px;
      padding: 5px;
      border-radius: 6px;
    }

    .running { background: #16a34a; }
    .idle { background: #facc15; color: black; }
    .fault { background: #dc2626; }
  </style>
</head>

<body>

<h1>⚙️ Machine Dashboard</h1>

<div class="container">
  <div class="card" onclick="openMachine('Machine1')">
    <h3>Machine 1</h3>
    <div id="status1" class="status">Loading...</div>
  </div>

  <div class="card" onclick="openMachine('Machine2')">
    <h3>Machine 2</h3>
    <div id="status2" class="status">Loading...</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
  var firebaseConfig = {
    apiKey: "AIzaSyAtUjNOxehowo3hBGQZ2Ln3-XgG7-LFTFo",
    databaseURL: "https://qr-machine-project-default-rtdb.asia-southeast1.firebasedatabase.app"
  };

  firebase.initializeApp(firebaseConfig);

  function openMachine(id) {
    window.location.href = "machine.html?id=" + id;
  }

  function updateStatus(machine, elementId) {
    firebase.database().ref(machine + "/latest").on("value", function(snapshot) {
      var data = snapshot.val();
      let el = document.getElementById(elementId);

      if (data) {
        el.innerText = data.status;
        el.className = "status";

        if (data.status.toLowerCase() === "running") el.classList.add("running");
        else if (data.status.toLowerCase() === "idle") el.classList.add("idle");
        else el.classList.add("fault");
      }
    });
  }

  updateStatus("Machine1", "status1");
  updateStatus("Machine2", "status2");
</script>

</body>
</html>
