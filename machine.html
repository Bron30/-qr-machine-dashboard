<!DOCTYPE html>
<html>
<head>
  <title>Live Machine Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      margin: 0;
    }

    header {
      background: #020617;
      padding: 15px;
      text-align: center;
      font-size: 22px;
    }

    .live {
      color: #22c55e;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% { opacity: 0.3; }
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    .value {
      font-size: 30px;
    }

    .status {
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
    }

    .running { background: #16a34a; }
    .idle { background: #facc15; color: black; }
    .fault { background: #dc2626; }

    button {
      margin: 20px;
      padding: 10px 20px;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header id="title">Machine Dashboard <br><span class="live">● LIVE</span></header>

<div class="container">
  <div class="card">
    <h3>Temperature</h3>
    <div id="temp" class="value">--</div>
  </div>

  <div class="card">
    <h3>RPM</h3>
    <div id="rpm" class="value">--</div>
  </div>

  <div class="card">
    <h3>Voltage</h3>
    <div id="voltage" class="value">--</div>
  </div>

  <div class="card">
    <h3>Status</h3>
    <div id="status" class="status">--</div>
  </div>
</div>

<div style="padding:20px;">
  <canvas id="tempChart"></canvas>
</div>

<center>
  <button onclick="goBack()">⬅ Back</button>
</center>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
  const params = new URLSearchParams(window.location.search);
  const machineId = params.get("id") || "Machine1";

  document.getElementById("title").innerHTML =
    machineId + " Dashboard <br><span class='live'>● LIVE</span>";

  var firebaseConfig = {
    apiKey: "AIzaSyAtUjNOxehowo3hBGQZ2Ln3-XgG7-LFTFo",
    databaseURL: "https://qr-machine-project-default-rtdb.asia-southeast1.firebasedatabase.app"
  };

  firebase.initializeApp(firebaseConfig);

  var latestRef = firebase.database().ref(machineId + "/latest");
  var historyRef = firebase.database().ref(machineId + "/history");

  // 🔹 Live Data
  latestRef.on("value", function(snapshot) {
    var data = snapshot.val();

    if (data) {
      document.getElementById("temp").innerText = data.temp + " °C";
      document.getElementById("rpm").innerText = data.rpm;
      document.getElementById("voltage").innerText = data.voltage + " V";

      let statusEl = document.getElementById("status");
      statusEl.innerText = data.status;
      statusEl.className = "status";

      if (data.status.toLowerCase() === "running") statusEl.classList.add("running");
      else if (data.status.toLowerCase() === "idle") statusEl.classList.add("idle");
      else statusEl.classList.add("fault");
    }
  });

  // 🔹 Graph
  var ctx = document.getElementById("tempChart").getContext("2d");

  var tempChart = new Chart(ctx, {
    type: "line",
    data: {
      labels: [],
      datasets: [{
        label: "Temperature",
        data: [],
        borderWidth: 2
      }]
    }
  });

  historyRef.on("value", function(snapshot) {
    var data = snapshot.val();

    if (data) {
      let labels = [];
      let temps = [];

      Object.keys(data).forEach((key) => {
        labels.push(key);
        temps.push(data[key].temp);
      });

      tempChart.data.labels = labels;
      tempChart.data.datasets[0].data = temps;
      tempChart.update();
    }
  });

  function goBack() {
    window.location.href = "index.html";
  }
</script>

</body>
</html>
